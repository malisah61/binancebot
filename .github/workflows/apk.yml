name: APK derle
on:
  push:
    branches: [main]
    paths: ["app/**", "android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Derle
        run: gradle -p android assembleRelease --no-daemon
      - name: Yeniden adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk KriptoAnaliz.apk
      - uses: actions/upload-artifact@v4
        with: { name: KriptoAnaliz-apk, path: KriptoAnaliz.apk }
      - name: Sürüm yayınla (telefondan indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kripto Analiz v1.0.${{ github.run_number }}
          body: "Telefonundan KriptoAnaliz.apk dosyasını indirip kur. Güncellemeler eski sürümün üstüne kurulur."
          files: KriptoAnaliz.apk
          make_latest: true
