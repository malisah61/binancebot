name: Bot döngüsü
# GitHub'ın zamanlayıcısı güvenilmez olduğu için: tek iş ~5.8 saat boyunca her 15 dakikada botu çalıştırır,
# bitince kendini yeniden başlatır. (Herkese açık repoda Actions ücretsizdir.)
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"   # döngü bir şekilde durursa yedek başlatıcı
permissions:
  contents: write
  actions: write
concurrency:
  group: bot-loop
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt
      - name: 15 dakikada bir çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: |
          git config user.name "kripto-bot"
          git config user.email "kripto-bot@users.noreply.github.com"
          for i in $(seq 1 22); do
            start=$(date +%s)
            git pull --rebase -q || true
            timeout 600 python bot/fbot.py || echo "bot hatası (devam)"
            git add state
            if ! git diff --cached --quiet; then
              git commit -qm "bot: durum $(date -u +%Y-%m-%dT%H:%MZ)"
              for j in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 6; done
            fi
            el=$(( $(date +%s) - start ))
            if [ $i -lt 22 ]; then sleep $(( el < 900 ? 900 - el : 1 )); fi   # son turda "[ ] &&" çıkış kodu 1 verip işi hatalı gösteriyordu
          done
      - name: Döngüyü yeniden başlat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot-loop.yml --ref main -R ${{ github.repository }}
