name: Günlük formasyon taraması
on:
  schedule:
    - cron: "9 0 * * *"   # her gün 03:09 (TR), günlük mum kapanınca
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache/d1
          key: gunluk-${{ github.run_id }}
          restore-keys: gunluk-
      - name: Formasyonlar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/daily.py
      - name: Kaydet
        run: |
          git config user.name "kripto-bot"
          git config user.email "kripto-bot@users.noreply.github.com"
          git add state/daily_patterns.json docs/gunluk
          git diff --cached --quiet && exit 0
          git commit -m "günlük formasyon taraması" -q
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
