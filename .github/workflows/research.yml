name: V5 araştırma
on:
  schedule:
    - cron: "23 2 * * 1,4"   # pazartesi ve perşembe 05:23 (TR)
  workflow_dispatch:
    inputs:
      days: { description: "Kaç günlük geçmiş", default: "90" }
      coins: { description: "Kaç coin", default: "40" }
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt
      - name: Veri önbelleği
        uses: actions/cache@v4
        with:
          path: data/cache
          key: binance-arsiv-${{ github.run_id }}
          restore-keys: binance-arsiv-
      - name: Araştırma
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RES_DAYS: ${{ github.event.inputs.days || '90' }}
          RES_COINS: ${{ github.event.inputs.coins || '40' }}
        run: python bot/research.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "kripto-bot"
          git config user.email "kripto-bot@users.noreply.github.com"
          git add state/research.json state/research.md state/model.json
          git diff --cached --quiet && exit 0
          git commit -m "araştırma: model güncellendi" -q
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
