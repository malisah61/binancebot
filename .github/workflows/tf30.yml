name: Zaman dilimi 1 yıllık test
on:
  workflow_dispatch:
    inputs:
      tf:
        description: "Zaman dilimi"
        required: true
        default: "30m"
        type: choice
        options: ["30m", "1h", "2h", "4h"]
permissions:
  contents: write
concurrency:
  group: tf30
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: tf30-${{ github.run_id }}
          restore-keys: |
            tf30-
            donus-
      - name: Analiz
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EX_TF: ${{ inputs.tf }}
        run: python bot/tf30.py
      - name: Kaydet
        run: |
          git config user.name "kripto-bot"
          git config user.email "kripto-bot@users.noreply.github.com"
          git add state/tf*.json docs/arastirma
          git diff --cached --quiet && exit 0
          git commit -m "30dk 1 yıllık test" -q
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
